<!doctype html>
<html lang="en" style="background-color:#09090b;color:#f4f4f5;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A warm, thoughtful AI you can chat with about anything. Your conversations are saved to your account."
    />
    <meta name="theme-color" content="#09090b" />
    <title>Lumi — your AI companion</title>
    <link rel="icon" type="image/png" href="./assets/lumi-logo.png" />
    <style>
      html, body {
        background-color: #09090b;
        color: #f4f4f5;
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      @keyframes lumiPulse {
        0% { transform: scale(0.95); opacity: 0.8; }
        100% { transform: scale(1.05); opacity: 1; }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <!-- Lovable Core Tailwind + Keyframes CSS -->
    <link rel="stylesheet" href="./assets/styles.css" />
    <!-- Markdown, Code Blocks, Math & Studio Custom Styles -->
    <link rel="stylesheet" href="./styles.css?v=3" />
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-accent selection:text-foreground" style="background-color:#09090b;">
    <div id="app">
      <div id="splash-preloader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#09090b;z-index:99999;">
        <img src="./assets/lumi-logo.png" style="width:72px;height:72px;border-radius:18px;animation:lumiPulse 1.2s ease-in-out infinite alternate;object-fit:cover;" alt="Lumi" />
        <div style="margin-top:18px;color:#a1a1aa;font-size:14px;letter-spacing:0.5px;font-family:sans-serif;">Starting Lumi…</div>
      </div>
    </div>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    <script src="./assets/voices.js" defer></script>
    <script src="./app.js?v=3" defer></script>
  </body>
</html>
